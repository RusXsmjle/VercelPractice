<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1">
  <title>RoomFund Mini</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <h1>RoomFund Mini</h1>
    <p>Quản lý tiền quỹ nhóm</p>

    <input id="name" placeholder="Tên thành viên">
    <input id="amount" type="number"
           placeholder="Số tiền (VND)" min="1">

    <button onclick="addPayment()">
      Thêm đóng góp
    </button>

    <h2>Tổng quỹ: <span id="total">0</span> VND</h2>
    <ul id="payments"></ul>
  </main>

  <script src="app.js"></script>
</body>
</html>
